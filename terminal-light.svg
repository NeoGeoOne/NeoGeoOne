<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 276" width="1200" height="276" role="img" aria-label="Terminal, Blade Runner scene of the day: Voight-Kampff test">
<style>text{white-space:pre}.ln{opacity:0;animation:show .25s linear forwards}@keyframes show{from{opacity:0}to{opacity:1}}.ty{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:type var(--d) steps(var(--n)) forwards}@keyframes type{to{transform:scaleX(1)}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){.ln{opacity:1!important;animation:none!important}.ty{transform:none!important;animation:none!important}}</style>
<rect x="1" y="1" width="1198" height="274" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<path d="M1 11 a10 10 0 0 1 10-10 h1178 a10 10 0 0 1 10 10 v25 h-1198 z" fill="#f6f8fa"/>
<circle cx="24" cy="19" r="6" fill="#ff5f56"/>
<circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="19" r="6" fill="#27c93f"/>
<text x="600.0" y="24" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#59636e">starsoules@nightcity: ~</text>
<g class="ln" style="animation-delay:0.40s"><text x="28" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15"><tspan fill="#0a7a85">$ </tspan></text><g class="ty" style="--d:1.53s;--n:34;animation-delay:0.40s"><text x="46.0" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#1f2328">voight-kampff --subject starsoules</text></g></g>
<text class="ln" style="animation-delay:2.28s" x="28" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#59636e">  calibrating ...................... ok   (pupil, blush, capillaries)</text>
<text class="ln" style="animation-delay:2.40s" x="28" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#1f2328">  Q1  a tortoise. a desert. you know the one.        pupil: steady</text>
<text class="ln" style="animation-delay:2.52s" x="28" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#1f2328">  Q2  a server you built is being retired.           pupil: dilated</text>
<text class="ln" style="animation-delay:2.64s" x="28" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#1f2328">  Q3  a stranger deletes /var/log "to save space".   blush: severe</text>
<text class="ln" style="animation-delay:2.76s" x="28" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#1f2328">  Q4  a progress bar stops at 99%.                   hand: on power button</text>
<text class="ln" style="animation-delay:2.88s" x="28" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#9a6700">  result: inconclusive. probably human. definitely tired.</text>
<g class="ln" style="animation-delay:3.00s"><text x="28" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#0a7a85">$ </text><rect class="cur" x="46.0" y="229" width="9" height="16" fill="#0a7a85"/></g>
</svg>
